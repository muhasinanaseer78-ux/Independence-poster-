<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>സ്വാതന്ത്ര്യദിന പോസ്റ്റർ ജനറേറ്റർ</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f2f4f3;font-family:Arial,"Noto Sans Malayalam",sans-serif;color:#075b2a}
  .wrap{max-width:560px;margin:auto;padding:18px}
  .card{background:white;border-radius:18px;padding:18px;box-shadow:0 4px 18px #0002}
  h1{font-size:24px;text-align:center;margin:5px 0 18px}
  label{display:block;font-weight:700;margin:14px 0 7px}
  input{width:100%;padding:13px;border:1px solid #ccd8cf;border-radius:10px;font-size:16px}
  button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:18px;font-size:18px;font-weight:700;background:#08752e;color:white}
  button.secondary{background:#ef8b00}
  #preview{width:100%;display:block;margin-top:18px;border-radius:10px}
  .hint{font-size:13px;color:#66756b;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🇮🇳 സ്വാതന്ത്ര്യദിന പോസ്റ്റർ</h1>

    <label>1. ഫോട്ടോ തിരഞ്ഞെടുക്കുക</label>
    <input id="photo" type="file" accept="image/*">

    <label>2. നിങ്ങളുടെ പേര്</label>
    <input id="name" type="text" placeholder="പേര് എഴുതുക">

    <button onclick="makePoster()">പോസ്റ്റർ തയ്യാറാക്കുക</button>
    <button class="secondary" onclick="downloadPoster()">⬇ പോസ്റ്റർ ഡൗൺലോഡ് ചെയ്യുക</button>

    <canvas id="canvas" style="display:none"></canvas>
    <img id="preview" alt="Poster preview">
    <p class="hint">ഫോട്ടോയും പേരും നൽകിയ ശേഷം “പോസ്റ്റർ തയ്യാറാക്കുക” അമർത്തുക.</p>
  </div>
</div>

<script>
const bgSrc = "poster-background.png";
let finalCanvas = null;

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const im = new Image();
    im.onload=()=>resolve(im);
    im.onerror=reject;
    im.src=src;
  });
}

async function makePoster(){
  const file = document.getElementById("photo").files[0];
  const name = document.getElementById("name").value.trim();

  if(!file){ alert("ദയവായി ഫോട്ടോ തിരഞ്ഞെടുക്കുക."); return; }
  if(!name){ alert("ദയവായി പേര് എഴുതുക."); return; }

  const bg = await loadImage(bgSrc);
  const userImg = await loadImage(URL.createObjectURL(file));

  const canvas = document.getElementById("canvas");
  canvas.width = bg.naturalWidth;
  canvas.height = bg.naturalHeight;
  const ctx = canvas.getContext("2d");

  ctx.drawImage(bg,0,0,canvas.width,canvas.height);

  // Photo circle — positioned over the large white circular area.
  const cx = canvas.width * 0.50;
  const cy = canvas.height * 0.53;
  const r  = canvas.width * 0.195;

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.clip();

  const scale = Math.max((2*r)/userImg.width,(2*r)/userImg.height);
  const w = userImg.width*scale, h=userImg.height*scale;
  ctx.drawImage(userImg,cx-w/2,cy-h/2,w,h);
  ctx.restore();

  // Clean white circular border.
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.lineWidth = 5;
  ctx.strokeStyle = "#ffffff";
  ctx.stroke();
  ctx.restore();

  // Name on the ribbon.
  const ribbonY = canvas.height * 0.745;
  ctx.save();
  ctx.font = `700 ${Math.round(canvas.width*0.035)}px "Noto Sans Malayalam", Arial, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "#0008";
  ctx.shadowBlur = 3;
  ctx.fillText(name, cx, ribbonY);
  ctx.restore();

  finalCanvas = canvas;
  document.getElementById("preview").src = canvas.toDataURL("image/png");
  document.getElementById("preview").scrollIntoView({behavior:"smooth",block:"center"});
}

function downloadPoster(){
  if(!finalCanvas){ alert("ആദ്യം പോസ്റ്റർ തയ്യാറാക്കുക."); return; }
  const name = (document.getElementById("name").value.trim() || "poster")
    .replace(/[^\w\u0D00-\u0D7F-]+/g,"_");
  const a=document.createElement("a");
  a.download=name+"_Independence_Day_Poster.png";
  a.href=finalCanvas.toDataURL("image/png");
  a.click();
}
</script>
</body>
</html>
